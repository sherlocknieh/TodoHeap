<svg xmlns="http://www.w3.org/2000/svg" viewBox="-48 -48 96 96" role="img" aria-label="TodoHeap">
  <title>TodoHeap</title>
  <defs>
    <!-- 六边形定义(中心在原点) -->
    <path id="cell" d="M 9.92 -0.745 A 1.50 1.50 0 0 1 9.92 0.755 L 5.61 8.215 A 1.50 1.50 0 0 1 4.31 8.965 L -4.31 8.965 A 1.50 1.50 0 0 1 -5.61 8.215 L -9.92 0.755 A 1.50 1.50 0 0 1 -9.92 -0.745 L -5.61 -8.215 A 1.50 1.50 0 0 1 -4.31 -8.965 L 4.31 -8.965 A 1.50 1.50 0 0 1 5.61 -8.215 L 9.92 -0.745 Z"/>
    <!-- 对钩形状定义 -->
    <g id="check"><path transform="rotate(-0)" d="M -3.915 1.035 L -1.215 3.735 L 3.915 -3.735"/></g>
  </defs>
  <!-- 白色圆形衬底 -->
  <circle cx="0" cy="0" r="46" fill="#ffffff" stroke="#e6eee9" stroke-width="2.0"/>
  <!-- 整体旋转(旋转度数: 0, 旋转中心: 0, 0) -->
  <g transform="rotate(0 0 0)">
    <!-- 六个六边形 -->
    <g fill="#8ac63e">
      <use href="#cell" transform="translate(-11.88 -20.215)"/> <!-- 顶部格子 -->
    </g>
    <g fill="#3ba758">
      <use href="#cell" transform="translate(-11.88 -0.005)"/>
      <use href="#cell" transform="translate(5.93 -10.115)"/>
      <use href="#cell" transform="translate(-11.88 20.205)"/> <!-- 底部格子 -->
      <use href="#cell" transform="translate(5.93 10.105)"/>
      <use href="#cell" transform="translate(23.74 -0.005)"/> <!-- 最右格子 -->
    </g>
    <g fill="#169d78">
    </g>
    <!-- 六个对钩 -->
    <g fill="none" stroke="#ffffff" stroke-width="2.43" stroke-linecap="round" stroke-linejoin="round">
      <use href="#check" transform="translate(-12.065 -20.625)"/>
      <use href="#check" transform="translate(-12.065 -0.415)"/>
      <use href="#check" transform="translate(-12.065 19.795)"/>
      <use href="#check" transform="translate(5.755 -10.525)"/>
      <use href="#check" transform="translate(5.755 9.695)"/>
      <use href="#check" transform="translate(23.565 -0.415)"/>
    </g>
  </g>
</svg>

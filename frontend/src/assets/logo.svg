<svg xmlns="http://www.w3.org/2000/svg" viewBox="-9600 -9600 19200 19200" role="img" aria-label="TodoHeap">
  <title>TodoHeap</title>
  <defs>
    <!-- 六边形定义(中心在原点, 坐标基准 200 单位 = 原 1 单位) -->
    <path id="cell" d="M 1984 -149 A 300 300 0 0 1 1984 151 L 1122 1643 A 300 300 0 0 1 862 1793 L -862 1793 A 300 300 0 0 1 -1122 1643 L -1984 151 A 300 300 0 0 1 -1984 -149 L -1122 -1643 A 300 300 0 0 1 -862 -1793 L 862 -1793 A 300 300 0 0 1 1122 -1643 L 1984 -149 Z"/>
    <!-- 对钩形状定义 -->
    <g id="check"><path transform="rotate(-0)" d="M -783 207 L -243 747 L 783 -747"/></g>
  </defs>
  <!-- 白色圆形衬底 -->
  <circle cx="0" cy="0" r="9200" fill="#ffffff" stroke="#e6eee9" stroke-width="400"/>
  <!-- 整体旋转(旋转度数: 0, 旋转中心: 0, 0) -->
  <g transform="rotate(0 0 0)">
    <!-- 六个六边形 -->
    <g fill="#8ac63e">
      <use href="#cell" transform="translate(-2376 -4043)"/> <!-- 顶部格子 -->
    </g>
    <g fill="#3ba758">
      <use href="#cell" transform="translate(-2376 -1)"/>
      <use href="#cell" transform="translate(1186 -2023)"/>
      <use href="#cell" transform="translate(-2376 4041)"/> <!-- 底部格子 -->
      <use href="#cell" transform="translate(1186 2021)"/>
      <use href="#cell" transform="translate(4748 -1)"/> <!-- 最右格子 -->
    </g>
    <g fill="#169d78">
    </g>
    <!-- 六个对钩 -->
    <g fill="none" stroke="#ffffff" stroke-width="486" stroke-linecap="round" stroke-linejoin="round">
      <use href="#check" transform="translate(-2413 -4125)"/>
      <use href="#check" transform="translate(-2413 -83)"/>
      <use href="#check" transform="translate(-2413 3959)"/>
      <use href="#check" transform="translate(1151 -2105)"/>
      <use href="#check" transform="translate(1151 1939)"/>
      <use href="#check" transform="translate(4713 -83)"/>
    </g>
  </g>
</svg>

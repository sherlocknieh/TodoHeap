<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="-192 -192 384 384" role="img" aria-label="TodoHeap">
  <title>TodoHeap</title>
  <defs>
    <!-- 六边形定义(中心在原点, 坐标基准 4 单位 = 原 1 单位) -->
    <path id="cell" d="M 40 -3 A 6 6 0 0 1 40 3 L 22 33 A 6 6 0 0 1 17 36 L -17 36 A 6 6 0 0 1 -22 33 L -40 3 A 6 6 0 0 1 -40 -3 L -22 -33 A 6 6 0 0 1 -17 -36 L 17 -36 A 6 6 0 0 1 22 -33 L 40 -3 Z"/>
    <!-- 对钩形状定义 -->
    <g id="check"><path transform="rotate(-0)" d="M -16 4 L -5 15 L 16 -15"/></g>
  </defs>
  <!-- 白色圆形衬底 -->
  <circle cx="0" cy="0" r="184" fill="#ffffff" stroke="#e6eee9" stroke-width="8"/>
  <!-- 整体旋转(旋转度数: 0, 旋转中心: 0, 0) -->
  <g transform="rotate(0 0 0)">
    <!-- 六个六边形: 行间距 80, 列间距 40√3≈69.282, 相邻列纵向错开 40, 任意相邻三格中心为正三角形 -->
    <g fill="#8ac63e">
      <use href="#cell" transform="translate(-48 -80)"/> <!-- 顶部格子 -->
    </g>
    <g fill="#3ba758">
      <use href="#cell" transform="translate(-48 0)"/>
      <use href="#cell" transform="translate(21.282 -40)"/>
      <use href="#cell" transform="translate(-48 80)"/> <!-- 底部格子 -->
      <use href="#cell" transform="translate(21.282 40)"/>
      <use href="#cell" transform="translate(90.564 0)"/> <!-- 最右格子 -->
    </g>
    <g fill="#169d78">
    </g>
    <!-- 六个对钩 -->
    <g fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
      <use href="#check" transform="translate(-49 -82)"/>
      <use href="#check" transform="translate(-49 -2)"/>
      <use href="#check" transform="translate(-49 78)"/>
      <use href="#check" transform="translate(20.282 -42)"/>
      <use href="#check" transform="translate(20.282 38)"/>
      <use href="#check" transform="translate(89.564 -2)"/>
    </g>
  </g>
</svg>
